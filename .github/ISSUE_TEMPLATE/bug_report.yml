name: Bug report
description: Something in mage-operator does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For questions about how to use the operator, open a [question](https://github.com/aknostic/mage-k8s-operator/issues/new?template=question.yml) instead. Security issues go through [SECURITY.md](https://github.com/aknostic/mage-k8s-operator/blob/main/SECURITY.md), not here.

        Remove passwords, keys and other secrets from anything you paste.
  - type: input
    id: operator-version
    attributes:
      label: Operator version
      description: Release tag, chart version or commit SHA.
      placeholder: v0.6.4
    validations:
      required: true
  - type: input
    id: kubernetes-version
    attributes:
      label: Kubernetes version and distribution
      description: Output of `kubectl version`, plus the distribution or provider (kind, Kapsule, and so on).
    validations:
      required: true
  - type: input
    id: magento-version
    attributes:
      label: Magento, Adobe Commerce or Mage-OS version
      description: The product and version inside your image.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the steps to reproduce, if you have them.
    validations:
      required: true
  - type: textarea
    id: magestore
    attributes:
      label: MageStore status
      description: Output of `kubectl get magestore <name> -o yaml`. The status conditions are the most useful part.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Operator logs
      description: Relevant lines from the operator pod, for example `kubectl logs -n <namespace> deploy/<operator-deployment>`.
      render: text
