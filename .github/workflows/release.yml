# Tag vX.Y.Z → multi-arch image + Helm OCI chart on ghcr.io, scanned,
# SBOM'd, cosign-signed, and a GitHub Release with generated notes.
# Ported from the former GitLab CI pipeline (build + release stages).
#
# Required repo secrets:
#   COSIGN_PRIVATE_KEY_B64  base64 of the cosign.key matching cosign.pub
#   COSIGN_PASSWORD         password of that key (empty string if none)
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mage-operator
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
  CHART_REF: ghcr.io/${{ github.repository_owner }}/charts/mage-operator

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chart.yaml version must match tag
        run: |
          CHART_VERSION=$(awk '/^version:/ {print $2; exit}' charts/mage-operator/Chart.yaml)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CHART_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Chart.yaml version ($CHART_VERSION) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (HIGH/CRITICAL fail the release)
        run: |
          docker run --rm aquasec/trivy:0.69.1 image --exit-code 1 \
            --severity HIGH,CRITICAL --no-progress \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY_B64 }}" | base64 -d > cosign.key
          cosign sign --key cosign.key --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - uses: azure/setup-helm@v4
      - name: Package, push and sign chart
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/mage-operator
          helm push mage-operator-*.tgz "${CHART_REPO}"
          cosign sign --key cosign.key --yes "${CHART_REF}:${GITHUB_REF_NAME#v}"
          rm -f cosign.key

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) PRERELEASE="--prerelease" ;; esac
          cat > notes.md <<NOTES
          **Image:** \`${IMAGE}:${GITHUB_REF_NAME}\`
          **Helm:** \`helm install mage-operator ${CHART_REPO}/mage-operator --version ${GITHUB_REF_NAME#v}\`

          Verify: \`cosign verify --key cosign.pub ${IMAGE}:${GITHUB_REF_NAME}\`

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for details.
          NOTES
          gh release create "$GITHUB_REF_NAME" $PRERELEASE \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes \
            mage-operator-*.tgz sbom.spdx.json cosign.pub
