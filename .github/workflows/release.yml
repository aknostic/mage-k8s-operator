# Tag vX.Y.Z → multi-arch image + Helm OCI chart on ghcr.io, scanned,
# SBOM'd, cosign-signed, and a GitHub Release with generated notes.
#
# The image is pushed by digest only, then scanned and signed; the
# vX.Y.Z (and latest) tags are added last, so a failed scan never
# leaves a release tag pointing at an unscanned or unsigned image.
#
# Required repo secrets:
#   COSIGN_PRIVATE_KEY_B64  base64 of the cosign.key matching cosign.pub
#   COSIGN_PASSWORD         password of that key (empty string if none)
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mage-operator
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
  CHART_REF: ghcr.io/${{ github.repository_owner }}/charts/mage-operator
  CRANE_VERSION: '0.20.3'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chart.yaml version must match tag
        run: |
          CHART_VERSION=$(awk '/^version:/ {print $2; exit}' charts/mage-operator/Chart.yaml)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CHART_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Chart.yaml version ($CHART_VERSION) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (by digest, untagged)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "DIGEST=${BUILD_DIGEST}" >> "$GITHUB_ENV"

      - name: Trivy scan (HIGH/CRITICAL fail the release)
        env:
          # The package is private until made public, so Trivy needs
          # registry credentials to pull it.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              aquasec/trivy:0.69.1 image --exit-code 1 \
              --severity HIGH,CRITICAL --no-progress --platform "$platform" \
              "${IMAGE}@${DIGEST}"
          done

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: sigstore/cosign-installer@v3
      - name: Write cosign key
        env:
          COSIGN_PRIVATE_KEY_B64: ${{ secrets.COSIGN_PRIVATE_KEY_B64 }}
        run: |
          umask 077
          echo "$COSIGN_PRIVATE_KEY_B64" | base64 -d > "$RUNNER_TEMP/cosign.key"

      - name: Sign image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --key "$RUNNER_TEMP/cosign.key" --yes "${IMAGE}@${DIGEST}"

      - name: Tag image
        run: |
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" crane
          # crane copies the manifest as-is, so each tag resolves to the
          # scanned and signed digest.
          "$RUNNER_TEMP/crane" tag "${IMAGE}@${DIGEST}" "$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in
            *-*) echo "Suffixed tag; leaving :latest where it is" ;;
            *) "$RUNNER_TEMP/crane" tag "${IMAGE}@${DIGEST}" latest ;;
          esac

      - uses: azure/setup-helm@v4
      - name: Package, push and sign chart
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package charts/mage-operator
          helm push mage-operator-*.tgz "${CHART_REPO}"
          cosign sign --key "$RUNNER_TEMP/cosign.key" --yes "${CHART_REF}:${GITHUB_REF_NAME#v}"

      - name: Remove cosign key
        if: always()
        run: rm -f "$RUNNER_TEMP/cosign.key"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) PRERELEASE="--prerelease" ;; esac
          cat > notes.md <<NOTES
          **Image:** \`${IMAGE}:${GITHUB_REF_NAME}\`
          **Helm:** \`helm install mage-operator ${CHART_REPO}/mage-operator --version ${GITHUB_REF_NAME#v}\`

          Verify: \`cosign verify --key cosign.pub ${IMAGE}:${GITHUB_REF_NAME}\`

          See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for details.
          NOTES
          gh release create "$GITHUB_REF_NAME" $PRERELEASE \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes \
            mage-operator-*.tgz sbom.spdx.json cosign.pub
