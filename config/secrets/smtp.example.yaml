# Template for the per-store SMTP Secret. Copy this to smtp.yaml,
# fill in real values, and run `sops -e -i config/secrets/smtp.yaml`
# to encrypt before committing.
#
# The keys below are the namespace msmtp's runtime config reads
# (see magento-test-image/ when the msmtp layer lands). Adding a new
# key requires updating both this template and the image's msmtprc.
#
# Change the metadata.name to match spec.email.smtpSecretRef on the
# MageStore CR once that field exists; for the current convention-based
# wiring we use `<store>-smtp` in the same namespace as the MageStore.
apiVersion: v1
kind: Secret
metadata:
  name: store-smtp
  namespace: demo
type: Opaque
stringData:
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_USERNAME: you@example.com
  SMTP_PASSWORD: PLACEHOLDER-do-not-commit-plaintext
  SMTP_FROM: admin@example.com
  # `login` (default) | `plain` | `cram-md5` | `oauthbearer`
  SMTP_AUTH: login
  # `starttls` (port 587) | `tls` (port 465, implicit) | `off`
  SMTP_TLS: starttls
