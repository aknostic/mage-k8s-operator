# This rule is not used by the project mage-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the mage.aknostic.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mage-operator
    app.kubernetes.io/managed-by: kustomize
  name: magestore-editor-role
rules:
- apiGroups:
  - mage.aknostic.com
  resources:
  - magestores
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mage.aknostic.com
  resources:
  - magestores/status
  verbs:
  - get
