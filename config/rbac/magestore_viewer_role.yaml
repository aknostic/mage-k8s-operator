# This rule is not used by the project mage-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to mage.aknostic.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mage-operator
    app.kubernetes.io/managed-by: kustomize
  name: magestore-viewer-role
rules:
- apiGroups:
  - mage.aknostic.com
  resources:
  - magestores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mage.aknostic.com
  resources:
  - magestores/status
  verbs:
  - get
