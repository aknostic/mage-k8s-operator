# Minimal Magento-aware nginx config for the Day-4 spike.
# Adapted from the Magento 2 upstream nginx.conf.sample, pruned for the
# single-container case. NOT for production.

worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;
daemon off;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log /dev/stdout;

    # Magento's admin response carries large Set-Cookie + form-key headers
    # that exceed nginx's default 4k fastcgi buffer and produce a 502.
    # Values match Magento's upstream nginx.conf.sample.
    fastcgi_buffer_size 128k;
    fastcgi_buffers 4 256k;
    fastcgi_busy_buffers_size 256k;

    # Hook for the mage-operator's `<store>-nginx-conf` ConfigMap — at
    # runtime the operator mounts `stores.conf` (two `map $http_host`
    # blocks feeding MAGE_RUN_CODE / MAGE_RUN_TYPE) into this directory.
    # The directive is at the http level so the map directives (which
    # Nginx only accepts in http context) take effect. The ConfigMap
    # may be absent during local / non-operator runs — nginx treats
    # missing glob matches as a no-op, so this is safe either way.
    # Per ADR 007 and docs/image-contract.md.
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 8080;
        server_name _;
        root /app/pub;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location /static/ {
            # Strip the /static/version<CONTENT_VERSION>/ cache-busting prefix
            # that Magento embeds in URLs — assets on disk live at
            # pub/static/<area>/<theme>/... without a version directory.
            # Using [^/]+ instead of the upstream sample's \d+ so our
            # dotted CONTENT_VERSION (e.g. "2.4.8") matches too.
            location ~ ^/static/version {
                rewrite ^/static/(version[^/]+/)?(.*)$ /static/$2 last;
            }
            expires max;
            try_files $uri $uri/ @static_fallback;
        }

        location @static_fallback {
            rewrite ^/static/(version[^/]+/)?(.*)$ /static.php?resource=$2 last;
        }

        location /media/ {
            try_files $uri $uri/ /get.php?$args;
        }

        location ~ ^/(index|get|static|errors/report|errors/404|errors/503|health_check)\.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 600s;
            # Per-request multi-store dispatch — surfaces the $MAGE_RUN_CODE /
            # $MAGE_RUN_TYPE variables from the `map $http_host` blocks in
            # /etc/nginx/conf.d/stores.conf (operator-rendered per ADR 007)
            # into Magento's bootstrap.php via $_SERVER. Empty strings when
            # stores.conf is absent or the request's Host doesn't match any
            # entry — Magento falls back to its default store.
            fastcgi_param MAGE_RUN_CODE $MAGE_RUN_CODE;
            fastcgi_param MAGE_RUN_TYPE $MAGE_RUN_TYPE;
            include fastcgi_params;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
