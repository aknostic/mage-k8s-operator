apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mage-operator.fullname" . }}-manager
  labels:
    {{- include "mage-operator.labels" . | nindent 4 }}
rules:
  # Capability detection at startup. cmd/main.go probes for each
  # dependency operator's CRD via the apiextensions client; without
  # get/list on customresourcedefinitions the operator pod fails
  # fast before the manager starts.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]

  # Core resources owned by every MageStore reconcile.
  - apiGroups: [""]
    resources:
      - configmaps
      - persistentvolumeclaims
      - secrets
      - services
    verbs: [create, delete, get, list, patch, update, watch]

  # Cron-pod drain detection during upgrade-arc quiesce: the
  # `cronPodsStillRunning` helper in ensure_upgrade.go lists Pods
  # by label and waits for them to terminate before creating the
  # setup:upgrade Job. The cached client backs that List() call
  # with a Watch, so list+watch are both required.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]

  # Pod exec for the post-arc Varnish ban: ensure_varnish.go's
  # banVarnish runs `varnishadm ban "obj.http.X-Magento-Tags ~ .*"`
  # via client-go remotecommand at stage-2 finalise. Best-effort,
  # skipped when KubeClient is nil.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]

  # Workloads + scaling.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [create, delete, get, list, patch, update, watch]

  # Cron groups + bootstrap Jobs.
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [create, delete, get, list, patch, update, watch]

  # Gateway API routing layer (per ADR 006 amendment).
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [create, delete, get, list, patch, update, watch]

  # External operator CRs the operator composes (ADR 004). Cache is
  # owned directly via StatefulSet/Deployment per ADR 009 — no
  # upstream Redis/Valkey operator CR is touched.
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [k8s.mariadb.com]
    resources: [mariadbs]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [opensearch.org]
    resources: [opensearchclusters]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [rabbitmq.com]
    resources: [rabbitmqclusters]
    verbs: [create, delete, get, list, patch, update, watch]

  # The operator's own CRD.
  - apiGroups: [mage.aknostic.com]
    resources: [magestores]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [mage.aknostic.com]
    resources: [magestores/finalizers]
    verbs: [update]
  - apiGroups: [mage.aknostic.com]
    resources: [magestores/status]
    verbs: [get, patch, update]
