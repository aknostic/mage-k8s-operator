apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.20.0
  name: magestores.mage.aknostic.com
spec:
  group: mage.aknostic.com
  names:
    kind: MageStore
    listKind: MageStoreList
    plural: magestores
    shortNames:
    - ms
    singular: magestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
